name: Hafte ki report (MinuteMe_GS)

on:
  schedule:
    - cron: "30 4 * * 0"     # har Ravivar subah ~10 baje (IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python packages
        run: pip install -r requirements.txt
      - name: Report banao
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python auto_poster.py --report
      - name: Report save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "Weekly report [skip ci]"
          git pull --rebase -X theirs --autostash || true
          git push || true
