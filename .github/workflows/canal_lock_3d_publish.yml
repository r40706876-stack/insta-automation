name: Publish authorized Panama 3D experiment once
on:
  push:
    branches: [main]
    paths: [.github/workflows/canal_lock_3d_publish.yml]
permissions:
  contents: write
concurrency:
  group: minuteme-canal-lock-3d
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install upload dependencies
        run: |
          pip install --timeout 30 --retries 1 -r requirements.txt imageio-ffmpeg
          python -c "import imageio_ffmpeg,os; p='/usr/local/bin/ffmpeg'; os.path.exists(p) or os.symlink(imageio_ffmpeg.get_ffmpeg_exe(),p)"
          python -m py_compile publish_canal_lock_3d.py
      - name: Set receipt commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Publish the exact reviewed Panama reel once
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          REVIEWED_SHA256: '92924810eab107c067404ca8eba6e121417862e09242da50755ec0e3823eb3f6'
          PYTHONUNBUFFERED: '1'
        run: python -u publish_canal_lock_3d.py
      - name: Preserve attempt and publication receipts
        if: always()
        run: |
          git add experiments/canal_lock_3d 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve Panama reel receipts [skip ci]'
          git pull --rebase -X theirs
          git push
