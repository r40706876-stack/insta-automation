name: GS Animation Studio
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'new_topic = नया विषय लिखें या खाली छोड़ें; अन्य दो पुराने demo हैं'
        type: choice
        options: [new_topic, dam_pressure, canal_lock]
        default: new_topic
      topic_text:
        description: 'अपना विषय हिंदी में लिखें; खाली = हर बार नया विषय'
        type: string
        default: ''
      subject:
        description: 'खाली विषय के लिए विषय-क्षेत्र'
        type: choice
        options: [auto, भूगोल, इतिहास, विज्ञान, राजव्यवस्था, अर्थशास्त्र, स्टैटिक जीके, पर्यावरण]
        default: auto
      reference_text:
        description: 'वैकल्पिक: प्रमाणित स्रोत का पाठ; खाली = AI स्रोत खोजेगा'
        type: string
        default: ''
      voice:
        description: 'auto = Gemini male, उपलब्ध न हो तो female fallback'
        type: choice
        options: [auto, female_fallback]
        default: auto
      verify_recovery:
        description: 'Test isolated renderer and silent-audio faults; build only'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [experiments/gs_animation_studio_request.json]
permissions:
  contents: write
concurrency:
  group: gs-animation-studio
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select the requested lesson
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_VOICE: ${{ inputs.voice }}
          INPUT_TOPIC_TEXT: ${{ inputs.topic_text }}
          INPUT_SUBJECT: ${{ inputs.subject }}
          INPUT_REFERENCE_TEXT: ${{ inputs.reference_text }}
          INPUT_TEST: ${{ inputs.verify_recovery }}
          EVENT_NAME: ${{ github.event_name }}
        run: python gs_animation_studio/select_request.py
      - name: Install operating-system rendering libraries
        run: |
          sudo python - <<'PYFIX'
          from pathlib import Path
          files=[p for p in Path('/etc/apt').rglob('*') if p.is_file() and p.suffix in {'.list','.sources','.txt'}]
          for p in files:
              if not p.exists():continue
              s=p.read_text().replace('http://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu').replace('http://archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu').replace('http://security.ubuntu.com/ubuntu','https://security.ubuntu.com/ubuntu')
              p.write_text(s)
          PYFIX
          timeout 240 sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=30 || timeout 240 sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=30
          timeout 240 sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -o Dpkg::Lock::Timeout=60 -o Acquire::Retries=1 -o Acquire::http::Timeout=30 ffmpeg xvfb xauth libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libxrender1 libxi6 libxkbcommon0
      - name: Install known working Python voice and text packages
        run: |
          python -m pip install --timeout 30 --retries 2 Pillow==13.0.0 numpy==2.4.6 requests==2.34.2 edge-tts==7.3.1 || python -m pip install --no-cache-dir --timeout 30 --retries 2 Pillow==13.0.0 numpy==2.4.6 requests==2.34.2 edge-tts==7.3.1
      - name: Reuse the verified Blender installation
        id: blender_cache
        uses: actions/cache@v4
        with:
          path: /tmp/blender
          key: gs-blender-4.2.0-linux-x64-4f4fd7646af01f6f
      - name: Download verified Blender with a bounded official mirror fallback
        if: steps.blender_cache.outputs.cache-hit != 'true'
        run: |
          for host in download.blender.org mirror.blender.org ftp.blender.org; do
            if curl -fL --retry 1 --connect-timeout 15 --max-time 120 "https://$host/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz" -o /tmp/blender.tar.xz; then
              if echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  /tmp/blender.tar.xz' | sha256sum -c -; then break; fi
            fi
          done
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  /tmp/blender.tar.xz' | sha256sum -c -
          mkdir -p /tmp/blender
          timeout 120 tar -xf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version
      - name: Verify recovery safety rules
        run: python -m unittest discover -s gs_animation_studio -p 'test_*.py' -v
      - name: Create voice and render the complete 3D lesson
        id: build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLENDER_BIN: /tmp/blender/blender
          PYTHONUNBUFFERED: '1'
        run: python -u gs_animation_studio.py --topic "$STUDIO_TOPIC"
      - name: Downloadable full reel and editable scene
        uses: actions/upload-artifact@v4
        with:
          name: GS-Animation-Studio-${{ env.STUDIO_TOPIC }}-${{ github.run_id }}
          path: ${{ steps.build.outputs.output }}
          retention-days: 30
      - name: Record unresolved setup failures
        if: failure()
        run: |
          mkdir -p "$STUDIO_DIAGNOSTICS"
          echo "A stage failed. Check the failed step in this run; no export is accepted without all validation checks." > "$STUDIO_DIAGNOSTICS/failed_stage.txt"
      - name: Retain diagnosis even when a stage fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GS-Studio-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: studio_diagnostics/
          if-no-files-found: warn
          retention-days: 30
      - name: Save verified render or failure diagnosis with bounded push retries
        if: always()
        env:
          OUTPUT_PATH: ${{ steps.build.outputs.output }}
        run: python gs_animation_studio/persist_results.py
