name: Maths PYQ reel (demo build)

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Reel spec JSON"
        default: "maths_reel/demo_bells.json"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: maths_reel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tools
        run: |
          pip install playwright
          python -m playwright install chromium || echo "runner ka Google Chrome use hoga"
          sudo apt-get install -y ffmpeg || which ffmpeg
      - name: Reel banao
        run: python maths_reel/maths_reel.py "${{ inputs.spec }}" maths_reel_demo.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: maths_reel_demo
          path: maths_reel_demo.mp4
          retention-days: 14
