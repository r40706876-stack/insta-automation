name: Cinematic history story - reference build
on:
  push:
    branches: [main]
    paths: [.github/workflows/history_film.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gs-history-documentary-preview
  cancel-in-progress: true
jobs:
  film:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install voice and compositor dependencies
        run: |
          pip install --timeout 30 --retries 1 -r requirements.txt imageio-ffmpeg
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends ffmpeg; fi
          python -m py_compile gs_history_blender.py gs_history_film.py
      - name: Prepare original voice and illustration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POST_MODE: manual
          PYTHONUNBUFFERED: '1'
        run: python -u gs_history_film.py --prepare
      - name: Verify reusable real Blender insert renders
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,subprocess
          r=pathlib.Path('experiments/meerut_delhi_film')
          m=json.loads((r/'blender_inserts.json').read_text())
          assert m['source_sha256']==hashlib.sha256(pathlib.Path('gs_history_blender.py').read_bytes()).hexdigest()
          for shot in ('chains','fort'):
              p=r/(shot+'.mp4')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==m[shot]['sha256']
              subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(p),'-f','null','-'],check=True)
              folder=r/shot;folder.mkdir(exist_ok=True)
              subprocess.run(['ffmpeg','-v','error','-y','-i',str(p),str(folder/'frame_%04d.png')],check=True)
              assert len(list(folder.glob('frame_*.png')))==48
          print('Two genuine 4-second Blender animations verified against renderer source')
          PY
      - name: Compose six-scene original history story
        run: python -u gs_history_film.py
      - name: Persist final preview and review data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          find experiments/meerut_delhi_film -name 'frame_*.png' -delete
          git add experiments/meerut_delhi_film
          git diff --cached --quiet && exit 0
          git commit -m 'Save cinematic history film and production review [skip ci]'
          git pull --rebase -X theirs
          git push
