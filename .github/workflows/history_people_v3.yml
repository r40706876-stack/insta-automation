name: History presentation v3 - narration-directed shots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install pillow numpy imageio-ffmpeg
          python -c "import os,shutil,imageio_ffmpeg; shutil.which('ffmpeg') or os.symlink(imageio_ffmpeg.get_ffmpeg_exe(),'/usr/local/bin/ffmpeg')"
          python gs_history_people_v3.py
      - name: Save checked preview
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add experiments/meerut_delhi_people_v3
          git diff --cached --quiet && exit 0
          git commit -m 'Save history v3 directed edit [skip ci]'
          git pull --rebase -X theirs
          git push
