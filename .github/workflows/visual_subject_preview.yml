name: Visual subject schedule preview - no publication
on:
  push:
    paths: [.github/workflows/visual_subject_preview.yml]
concurrency:
  group: viewer-preview-only
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install --timeout 30 --retries 1 -r requirements.txt imageio-ffmpeg
          python -c "import imageio_ffmpeg,os; p='/usr/local/bin/ffmpeg'; os.path.exists(p) or os.symlink(imageio_ffmpeg.get_ffmpeg_exe(),p)"
      - run: python -m py_compile viewer_seabreeze.py && python viewer_seabreeze.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GS_TARGET_UTC: '2026-10-27T04:30:00Z'
          GS_SUBJECT: Geography
          REEL_FORMAT: list
          POST_MODE: manual
          PYTHONUNBUFFERED: '1'
      - name: Save preview
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add experiments/viewer_seabreeze_v1
          git diff --cached --quiet && exit 0
          git commit -m 'Save scheduled visual experiment preview [skip ci]'
          git pull --rebase -X theirs
          git push

