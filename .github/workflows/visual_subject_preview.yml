name: Visual subject schedule preview - no publication
on:
  push:
    paths: [.github/workflows/visual_subject_preview.yml]
concurrency:
  group: viewer-preview-only
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install --timeout 30 --retries 1 -r requirements.txt imageio-ffmpeg
          python -c "import imageio_ffmpeg,os; p='/usr/local/bin/ffmpeg'; os.path.exists(p) or os.symlink(imageio_ffmpeg.get_ffmpeg_exe(),p)"
      - run: python -m py_compile cinematic_history_dandi.py && python cinematic_history_dandi.py
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GS_TARGET_UTC: '2026-10-27T04:30:00Z'
          GS_SUBJECT: Geography
          REEL_FORMAT: list
          POST_MODE: manual
          PYTHONUNBUFFERED: '1'
      - name: Save preview
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add experiments/history_dandi_cinematic_v1
          git diff --cached --quiet && exit 0
          git commit -m 'Save scheduled visual experiment preview [skip ci]'
          git pull --rebase -X theirs
          git push

# Retry first sourced preview after script validation failed.

# Final visual review: wind clears the mountain crest.

# Rebuild distinct four-scene viewer retry including visible WhatsApp banner.

# Include physically corrected expanding air parcel and over-crest wind path.

# Final typography check: no unsupported arrow glyph; exact rain-shadow title.

# Next topic: animated sea breeze / land breeze. Build preview only.

# Final pacing pass: at least 20 seconds, matching visual and narration speed.

# Simplify after user feedback: daytime only, remove night and upper return flow.

# User-authorized story pass: acted hook, camera shots, scarf, quiet sound design.

# Final framing pass: leg/label separation and unobstructed facial reaction.

# Restore reference shaded globe quality; new coast art and full-frame causal layers.

# Final scene review: anchor sand label over sand and reuse unchanged narration.

# History preview: 3D salt, tax, geographic journey and sourced dates; never publish.
