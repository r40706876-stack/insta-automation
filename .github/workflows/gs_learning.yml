name: GS age-matched learning and regression checks
on:
  push:
    paths: ['gs_*.py', 'tests/test_gs_learning.py', 'experiments/learning/import.json', '.github/workflows/gs_learning.yml']
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gs-learning
  cancel-in-progress: false
jobs:
  learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest discover -s tests -p 'test_gs_learning.py' -v
      - name: Collect live account observations
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python gs_collect_analytics.py
      - name: Import verified observations and report
        run: |
          if [ -f experiments/learning/import.json ]; then
            python gs_learning.py --import-json experiments/learning/import.json
          else
            python gs_learning.py
          fi
      - name: Save observations and report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add reports/gs_*.json
          if [ -f experiments/learning/snapshots.json ]; then git add experiments/learning/snapshots.json; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Update age-matched GS learning report [skip ci]'
          git pull --rebase
          git push
