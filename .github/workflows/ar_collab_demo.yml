name: One AR Publication Collab demo
on:
  push:
    paths: [.github/workflows/ar_collab_demo.yml]
permissions:
  contents: write
concurrency:
  group: ar-collab-demo-once
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          pip install --timeout 30 --retries 1 -r requirements.txt imageio-ffmpeg
          python -c "import imageio_ffmpeg,os; p='/usr/local/bin/ffmpeg'; os.path.exists(p) or os.symlink(imageio_ffmpeg.get_ffmpeg_exe(),p)"
      - name: Publish one authorized demo
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PYTHONUNBUFFERED: '1'
        run: python ar_collab_demo.py
      - name: Preserve receipt even on failure
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add experiments/ar_collab_demo_20261026
          git diff --cached --quiet && exit 0
          git commit -m 'Save AR Collab demo state [skip ci]'
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ar-collab-demo
          path: experiments/ar_collab_demo_20261026
