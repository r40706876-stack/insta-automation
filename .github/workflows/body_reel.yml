name: Human Body 3D reel (Blender template)
# Folder: experiments/body_3d/   Workflow: .github/workflows/body_reel.yml
# Give a topic in Hindi (Gemini plans it) OR the path of a ready topic JSON.
# Nothing is published or committed: the reel comes back as the artifact "body-reel".
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Video banne ke baad Instagram pe post karein?'
        type: choice
        default: 'yes'
        options: ['yes', 'no']
      topic:
        description: 'Topic chuno (sabse upar wala = taiyaar demo)'
        type: choice
        default: 'auto (agla topic)'
        options:
          - 'auto (agla topic)'
          - 'दिल और खून का सफ़र (तैयार demo)'
          - 'अपना topic लिखूँगा (नीचे topic_text में)'
          - 'दिल एक दिन में कितनी बार धड़कता है'
          - 'धमनी और शिरा में अंतर'
          - 'फुफ्फुसीय धमनी अशुद्ध खून क्यों ले जाती है'
          - 'दोहरा परिसंचरण: दिल से फेफड़े और पूरा शरीर'
          - 'महाधमनी: शरीर की सबसे बड़ी धमनी'
          - 'साँस लेने की प्रक्रिया: नाक से फेफड़ों तक'
          - 'श्वासनली और श्वसनी का काम'
          - 'स्वरयंत्र: आवाज़ कहाँ से बनती है'
          - 'फेफड़े: शरीर में ऑक्सीजन का दरवाज़ा'
          - 'पाचन तंत्र में भोजन का सफ़र'
          - 'ग्रासनली: भोजन की नली'
          - 'आमाशय में भोजन का पाचन'
          - 'छोटी आँत में पाचन और अवशोषण'
          - 'बड़ी आँत का काम'
          - 'अपेंडिक्स: एक अवशेषी अंग'
          - 'जीभ और स्वाद'
          - 'यकृत: शरीर की सबसे बड़ी ग्रंथि'
          - 'पित्ताशय और पित्त रस का काम'
          - 'अग्न्याशय: इंसुलिन बनाने वाली ग्रंथि'
          - 'किडनी खून को कैसे साफ़ करती है'
          - 'मूत्र तंत्र: किडनी से मूत्राशय तक'
          - 'थायरॉइड ग्रंथि और आयोडीन'
          - 'अधिवृक्क ग्रंथि: आपातकाल का हार्मोन एड्रेनालिन'
          - 'मानव शरीर की प्रमुख अंतःस्रावी ग्रंथियाँ'
          - 'मस्तिष्क के भाग और उनके काम'
          - 'अनुमस्तिष्क: शरीर का संतुलन'
          - 'मेरुरज्जु और प्रतिवर्ती क्रिया'
          - 'तंत्रिका तंत्र: संदेश कैसे जाता है'
          - 'मानव आँख की बनावट'
          - 'मानव कंकाल: वयस्क में 206 हड्डियाँ'
          - 'सबसे लंबी हड्डी: फीमर'
          - 'सबसे छोटी हड्डी: स्टेपीज़ (कान में)'
          - 'खोपड़ी: मस्तिष्क का कवच'
          - 'रीढ़ की हड्डी की बनावट'
          - 'पसलियाँ: दिल और फेफड़ों की रक्षा'
          - 'दाँतों के प्रकार और काम'
          - 'हाथ और पैर की हड्डियाँ'
          - 'श्रोणि (पेल्विस) की हड्डी'
          - 'मानव शरीर के प्रमुख अंग तंत्र'
          - 'मानव शरीर के सबसे बड़े अंग: त्वचा और यकृत'
      topic_text:
        description: 'Sirf tab bharo jab upar "अपना topic लिखूँगा" chuna ho'
        default: ''
      topic_file:
        description: 'Taiyaar demo JSON (badalne ki zarurat nahi)'
        default: 'topics/heart_blood.json'
      chunks:
        description: 'Parallel render machines (1-20); 12 leaves room for the regular posts'
        default: '12'
      target_utc:
        description: 'Post at this exact UTC time (empty = right after build)'
        default: ''
      samples:
        description: 'Cycles samples (12 = reference quality)'
        default: '12'
permissions:
  contents: write
  actions: write
env:
  BODY_DIR: experiments/body_3d
  BLENDER_URL: https://github.com/UPBGE/upbge/releases/download/v0.44/upbge-0.44-linux-x86_64.tar.xz
  BLENDER_SHA256: cb23e1003dc3ec10847eb7ac4380eba9cd5de6a53b944d6231f46841534afd5f

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      frames: ${{ steps.m.outputs.frames }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Topic plan (Gemini, validated) or ready JSON
        timeout-minutes: 30
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC_CHOICE: ${{ github.event.inputs.topic }}
          TOPIC_TEXT: ${{ github.event.inputs.topic_text }}
        run: |
          cd "$BODY_DIR"
          F=$(python -c "import json,sys;print(json.load(open('topics/index.json')).get(sys.argv[1],''))" "$TOPIC_CHOICE")
          if [ "$TOPIC_CHOICE" = "${{ github.event.inputs.topic_file }}" ] || [[ "$TOPIC_CHOICE" == *"तैयार demo"* && "${{ github.event.inputs.topic_file }}" != "topics/heart_blood.json" ]]; then F="${{ github.event.inputs.topic_file }}"; fi
          if [[ "$TOPIC_CHOICE" == *"अपना topic"* ]]; then
            [ -n "$TOPIC_TEXT" ] || { echo "::error::topic_text khaali hai"; exit 1; }
            pip install -q requests; python planner.py "$TOPIC_TEXT" plan.json > /tmp/plan.log 2>&1 || { echo "::error title=plan failed::$(tail -c 2500 /tmp/plan.log | tr '\n' ' ')"; exit 1; }; cat /tmp/plan.log
          elif [[ "$TOPIC_CHOICE" == auto* ]]; then
            python pick_next.py plan.json | tee /tmp/pick.log; echo "::notice title=plan::$(cat /tmp/pick.log)"
          elif [ -n "$F" ]; then
            echo "::notice title=plan::taiyaar kahani $F"; cp "$F" plan.json; python pick_next.py plan.json --teaser
          else
            pip install -q requests; python planner.py "$TOPIC_CHOICE" plan.json > /tmp/plan.log 2>&1 || { echo "::error title=plan failed::$(tail -c 2500 /tmp/plan.log | tr '\n' ' ')"; exit 1; }; cat /tmp/plan.log
          fi
          cat plan.json
      - name: Hindi voiceover (Gemini male Charon, one voice per video)
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests numpy edge-tts
          cd "$BODY_DIR"
          python voice.py plan.json out > /tmp/voice.log 2>&1 || { echo "::error title=voice failed::$(tail -c 1500 /tmp/voice.log | tr '\n' ' ')"; exit 1; }
          cat /tmp/voice.log
          echo "::notice title=voice::$(grep -E 'VOICE|NO VOICE' /tmp/voice.log | tr '\n' ' ')"
      - id: m
        run: |
          cd "$BODY_DIR"
          n=${{ github.event.inputs.chunks }}; n=$(( n<1 ? 1 : (n>20 ? 20 : n) ))
          python - "$n" >> "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          p=json.load(open('plan.json')); fps=p.get('fps',24)
          N=sum(round(s['seconds']*fps) for s in p['scenes']); n=int(sys.argv[1])
          print('frames=%d' % N); print('matrix='+json.dumps({'chunk':list(range(n))}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            ${{ env.BODY_DIR }}/plan.json
            ${{ env.BODY_DIR }}/out/voice/*

  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - id: c
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blender
            ${{ env.BODY_DIR }}/body_assets.blend
            ${{ env.BODY_DIR }}/organ_index.json
          key: body-assets-v2-${{ hashFiles('experiments/body_3d/prepare_assets.py', 'experiments/body_3d/organs.json') }}
      - name: Blender + Z-Anatomy -> body_assets.blend
        if: steps.c.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          LOG=/tmp/assets.log
          fail() { echo "::error title=assets failed at: $1::$(tail -c 2500 $LOG | tr '\n' ' ' | tr -s ' ')"; exit 1; }
          { curl -fL --retry 3 -sS "$BLENDER_URL" -o /tmp/b.tar.xz && ls -la /tmp/b.tar.xz; } >>$LOG 2>&1 || fail download
          echo "$BLENDER_SHA256  /tmp/b.tar.xz" | sha256sum -c - >>$LOG 2>&1 || fail sha256
          { mkdir -p /tmp/blender && tar -xf /tmp/b.tar.xz -C /tmp/blender --strip-components=1; } >>$LOG 2>&1 || fail untar
          { sudo apt-get update -qq && sudo apt-get install -y -qq libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libxxf86vm1 libxfixes3 libx11-6 libpulse0 libsndfile1 libvulkan1 libice6 libx11-xcb1 libxext6 libxau6 libxdmcp6 libdbus-1-3; } >>$LOG 2>&1 || fail apt
          /tmp/blender/blender -b --version >>$LOG 2>&1 || { ldd /tmp/blender/blender | grep 'not found' > $LOG; fail blender-start-missing-libs; }
          bash "$BODY_DIR/fetch_za.sh" /tmp/za >>$LOG 2>&1 || fail fetch-models
          ( cd "$BODY_DIR" && ZA_DIR=/tmp/za/Resources/Models/FBX BODY_ROOT=$PWD /tmp/blender/blender -b -t 0 --python-exit-code 3 --python prepare_assets.py ) >>$LOG 2>&1 || fail prepare
          grep -q "ASSETS OK" $LOG || fail prepare-no-ok
          grep -E "ASSETS|organ " $LOG | tail -50
          echo "::notice title=assets ok::$(grep ASSETS $LOG)"

  smoke:
    # Self-healing: render 2 tiny frames + the overlay BEFORE the real render. If the latest code is broken,
    # roll the renderer back to the last version that produced a real video (tag body3d-good) and use that.
    needs: [plan, assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      rolled_back: ${{ steps.s.outputs.rolled_back }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/blender
            ${{ env.BODY_DIR }}/body_assets.blend
            ${{ env.BODY_DIR }}/organ_index.json
          key: body-assets-v2-${{ hashFiles('experiments/body_3d/prepare_assets.py', 'experiments/body_3d/organs.json') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with: { name: plan, path: '${{ env.BODY_DIR }}' }
      - id: s
        name: Smoke test (auto rollback to last good code)
        run: |
          for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libpulse0 libsndfile1 libvulkan1 libice6 libx11-xcb1 libxext6 libxau6 libxdmcp6 libdbus-1-3 && break; sleep 15; done
          pip install -q numpy Pillow
          cd "$BODY_DIR"; N=${{ needs.plan.outputs.frames }}
          smoke() {
            rm -rf /tmp/smoke; mkdir -p /tmp/smoke
            TOPIC=$PWD/plan.json OUT=/tmp/smoke BODY_ROOT=$PWD DEMO_SAMPLES=1 BODY_RES_PCT=20 DEMO_FRAMES="3,$((N/2)),$((N-5))" \
              /tmp/blender/blender -b -t 0 --python-exit-code 3 --python body_scene.py > /tmp/smoke.log 2>&1 || return 1
            [ "$(ls /tmp/smoke/frames/*.png 2>/dev/null | wc -l)" -eq 3 ] || return 1
            TOPIC=$PWD/plan.json OUT=/tmp/smoke BODY_ROOT=$PWD python -c "import compose; [compose.overlay(f) for f in (3, $((N/2)), $((N-5)))]" >> /tmp/smoke.log 2>&1 || return 1
          }
          mkdir -p /tmp/code
          if smoke; then
            echo "rolled_back=false" >> "$GITHUB_OUTPUT"; echo "::notice title=smoke::latest code OK"
          else
            echo "::warning title=self-heal::latest renderer failed the smoke test, rolling back: $(grep -E 'Error|Traceback' /tmp/smoke.log | tail -3 | tr '\n' ' ')"
            git fetch -q --tags origin
            REF=body3d-good; git rev-parse -q --verify refs/tags/body3d-good >/dev/null || REF=e1c348d3c0edc6f4ba068d637b3786eb8b8abbb3   # first good real video
            git checkout "$REF" -- body_scene.py compose.py
            smoke || { echo "::error title=smoke failed even after rollback::$(tail -c 1500 /tmp/smoke.log | tr '\n' ' ')"; exit 1; }
            echo "rolled_back=true" >> "$GITHUB_OUTPUT"; echo "::notice title=self-heal::rolled back to body3d-good and it works"
          fi
          cp body_scene.py compose.py /tmp/code/
      - uses: actions/upload-artifact@v4
        with: { name: code, path: /tmp/code/ }

  render:
    needs: [plan, assets, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/blender
            ${{ env.BODY_DIR }}/body_assets.blend
            ${{ env.BODY_DIR }}/organ_index.json
          key: body-assets-v2-${{ hashFiles('experiments/body_3d/prepare_assets.py', 'experiments/body_3d/organs.json') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with: { name: plan, path: '${{ env.BODY_DIR }}' }
      - uses: actions/download-artifact@v4
        with: { name: code, path: '${{ env.BODY_DIR }}' }
      - name: Render my frame range
        env:
          BLENDER: /tmp/blender/blender
          DEMO_SAMPLES: ${{ github.event.inputs.samples }}
        run: |
          for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libpulse0 libsndfile1 libvulkan1 libice6 libx11-xcb1 libxext6 libxau6 libxdmcp6 libdbus-1-3 && break; sleep 15; done
          cd "$BODY_DIR"; export TOPIC=$PWD/plan.json OUT=$PWD/out
          N=${{ needs.plan.outputs.frames }}; n=${{ strategy.job-total }}; i=${{ matrix.chunk }}
          a=$(( i*N/n )); b=$(( (i+1)*N/n - 1 )); echo "chunk $i/$n -> $a-$b"; s=$(date +%s)
          ./render_range.sh $a $b 2>&1 | tee /tmp/render.log
          if [ "$(ls out/frames/*.png 2>/dev/null | wc -l)" -lt $((b-a+1)) ]; then echo "::warning::chunk $i retry (missing frames)"; ./render_range.sh $a $b 2>&1 | tee -a /tmp/render.log; fi
          n_ok=$(ls out/frames/*.png 2>/dev/null | wc -l)
          if [ "$n_ok" -lt $((b-a+1)) ]; then echo "::error title=render chunk $i made $n_ok/$((b-a+1)) frames::$(tail -c 2500 /tmp/render.log | tr '\n' ' ')"; exit 1; fi
          echo "rendered $((b-a+1)) frames in $(( $(date +%s)-s ))s on $(nproc) CPUs"
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.chunk }}
          path: |
            ${{ env.BODY_DIR }}/out/frames/*.png
            ${{ env.BODY_DIR }}/out/pins.json
          retention-days: 3

  compose:
    needs: [plan, smoke, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/download-artifact@v4
        with: { name: plan, path: '${{ env.BODY_DIR }}' }
      - uses: actions/download-artifact@v4
        with: { pattern: 'frames-*', merge-multiple: true, path: '${{ env.BODY_DIR }}/out' }
      - uses: actions/download-artifact@v4
        with: { name: code, path: '${{ env.BODY_DIR }}' }
      - name: Overlays + sound -> MP4
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0
          pip install -q numpy Pillow
          python -c "from PIL import features; assert features.check('raqm'), 'Hindi shaping missing'"
          cd "$BODY_DIR"; test "$(ls out/frames/*.png | wc -l)" -eq "${{ needs.plan.outputs.frames }}"
          TOPIC=$PWD/plan.json OUT=$PWD/out BODY_ROOT=$PWD python compose.py > /tmp/compose.log 2>&1 || { echo "::error title=compose failed::$(tail -c 2500 /tmp/compose.log | tr '\n' ' ')"; exit 1; }
          cat /tmp/compose.log
      - uses: actions/upload-artifact@v4
        with:
          name: body-reel
          path: |
            ${{ env.BODY_DIR }}/out/reel.mp4
            ${{ env.BODY_DIR }}/out/contact_sheet.jpg
            ${{ env.BODY_DIR }}/plan.json
          retention-days: 30
      - name: Save into downloads/ folder of the repo
        run: |
          d="downloads/body/$(date -u +%Y-%m-%d)_run${{ github.run_id }}"
          echo "SAVED_DIR=$d" >> "$GITHUB_ENV"
          mkdir -p "$d"; cp "$BODY_DIR/out/reel.mp4" "$BODY_DIR/out/contact_sheet.jpg" "$BODY_DIR/plan.json" "$d/"
          if ls "$BODY_DIR"/out/carousel/*.jpg >/dev/null 2>&1; then mkdir -p "$d/carousel"; cp "$BODY_DIR"/out/carousel/*.jpg "$d/carousel/"; fi
          git config user.name 'github-actions[bot]'; git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add downloads; git commit -m "Save reel to $d [skip ci]"
          ok=0; for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && { ok=1; break; }; sleep $((i*7)); done; [ $ok = 1 ] || { echo "::error title=save to downloads failed::push rejected 5 times"; exit 1; }
      - name: Mark this code as last good (self-heal rollback point)
        if: ${{ needs.smoke.outputs.rolled_back != 'true' }}
        run: |
          git tag -f body3d-good "$GITHUB_SHA" && git push -f -q origin refs/tags/body3d-good && echo "body3d-good -> $GITHUB_SHA" || true
      - name: Publish to Instagram (MinuteMe_GS)
        if: ${{ github.event.inputs.publish != 'no' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TARGET_UTC: ${{ github.event.inputs.target_utc }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          pip install -q --timeout 30 -r requirements.txt imageio-ffmpeg
          python -c "import imageio_ffmpeg,os; p='/usr/local/bin/ffmpeg'; os.path.exists(p) or os.symlink(imageio_ffmpeg.get_ffmpeg_exe(),p)"
          python -u publish_3d_reel.py "$SAVED_DIR" body 2>&1 | sed -u -E 's/(access_token=|key=|Bearer |OAuth )[^&" ]+/\1***/g' | tee /tmp/pub.log
          grep -qE "PUBLISHED|ALREADY PUBLISHED" /tmp/pub.log || { echo "::error title=publish failed::$(tail -c 1500 /tmp/pub.log | tr '\n' ' ')"; exit 1; }
          echo "::notice title=instagram::$(grep -E 'PUBLISHED' /tmp/pub.log | tail -1)"

  fallback:
    # 3D reel failed for a scheduled slot -> the slot must not stay empty: post the 7-PYQ list reel instead.
    needs: [plan, assets, smoke, render, compose]
    if: ${{ failure() && github.event.inputs.target_utc != '' && github.event.inputs.publish != 'no' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Queue 7-PYQ list reel for this slot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TGT: ${{ github.event.inputs.target_utc }}
        run: |
          T=$(date -u -d "$TGT" +%s); MIN=$(( $(date +%s) + 600 )); [ $T -lt $MIN ] && T=$MIN
          TU=$(date -u -d @$T +%Y-%m-%dT%H:%M:%SZ); SL=$(TZ=Asia/Kolkata date -d @$T +%H:%M)
          gh workflow run hourly_post.yml -R "$REPO" --ref main -f format=list -f subject= -f regular_slot="$SL" -f target_utc="$TU" -f post_mode=publish
          echo "::warning title=fallback::3D body reel failed; 7-PYQ list queued for $SL IST"
