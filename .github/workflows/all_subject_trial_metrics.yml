name: GS trial - capture each reel at 24 hours
on:
  push:
    branches: [main]
    paths: [experiments/all_subject_metrics_request.json]
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: gs-trial-metrics
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read metrics using the existing account token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ '${{ github.event_name }}' = 'push' ]; then
            python trial_metrics.py probe
          fi
          python trial_metrics.py
      - name: Preserve snapshots
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add experiments/all_subject_trial_20261026
          if ! git diff --cached --quiet; then
            git commit -m 'Save GS trial 24-hour metrics [skip ci]'
            for attempt in 1 2 3 4; do
              git pull --rebase && git push && exit 0
              sleep $((attempt * 2))
            done
            exit 1
          fi
      - name: Stop this one-off observer when all seven snapshots are saved
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -f experiments/all_subject_trial_20261026/snapshots_complete.flag ] || [ -f experiments/all_subject_trial_20261026/observer_timeout.flag ]; then
            gh workflow disable all_subject_trial_metrics.yml -R "$REPO"
          fi
