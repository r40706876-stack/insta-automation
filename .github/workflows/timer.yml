name: Timer (theek samay par reel)

# GitHub ka apna schedule 45-90 min der se chalta tha. Ye timer khud sota hai, theek samay par
# hourly_post.yml ko us slot ke format ke saath chalata hai, fir khud ko dobara chala deta hai.
# Public repo = minute free. Backup: har ghante schedule timer ko jaga deta hai (chain toot jaaye to bhi).
on:
  push:
    paths: [.github/workflows/timer.yml]
  workflow_dispatch:
  schedule:
    - cron: '29 * * * *'     # har ghante jaagta hai: chain toote to bhi agla slot nahi chhootega

concurrency:
  group: minuteme-timer
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  timer:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Agla slot tak ruko, reel run chalao, timer dobara
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # IST samay = format (pehle wale schedule jaise, ab theek samay par)
          SLOTS="05:00=current 07:00=list 10:00=list_Geography 13:00=list_History 17:00=mega 20:00=list_Static 22:00=list_Alternate"
          NOW=$(date +%s)
          BEST=""; BESTT=0
          for d in today tomorrow; do
            for s in $SLOTS; do
              T=${s%%=*}; J=${s##*=}
              TS=$(TZ=Asia/Kolkata date -d "$d $T" +%s)
              # Revised regular schedule begins tomorrow; tonight is reserved for the trial.
              START=$(TZ=Asia/Kolkata date -d '2026-10-27 00:00' +%s)
              if [ "$TS" -lt "$START" ]; then continue; fi
              if [ $TS -gt $((NOW+60)) ] && { [ -z "$BEST" ] || [ $TS -lt $BESTT ]; }; then BEST=$J; BESTT=$TS; BESTS=$T; fi
            done
          done
          W=$((BESTT-NOW-3600))
          if [ "$W" -lt 0 ]; then W=0; fi
          echo "Agla: $BEST, $(TZ=Asia/Kolkata date -d @$BESTT '+%d %b %H:%M IST') ($W sec baad)"
          if [ $W -le 16200 ]; then
            sleep $W
            SUBJECT=""
            case "$BEST" in
              list_Geography) BEST=list; SUBJECT=Geography ;;
              list_History) BEST=list; SUBJECT=History ;;
              list_Static) BEST=list; SUBJECT="Traditional GK" ;;
              list_Alternate)
                BEST=list
                DAYS=$((BESTT / 86400))
                if [ $((DAYS % 2)) -eq 0 ]; then SUBJECT=Polity; else SUBJECT=Economics; fi ;;
            esac
            gh workflow run hourly_post.yml -R "$REPO" --ref main -f format="$BEST" -f subject="$SUBJECT" -f regular_slot="$BESTS" -f target_utc="$(date -u -d @$BESTT +%Y-%m-%dT%H:%M:%SZ)" -f post_mode=publish && echo "reel ($BEST / $SUBJECT) chalayi"
            REST=$((BESTT-$(date +%s)+90))
            if [ "$REST" -gt 0 ]; then sleep "$REST"; fi
          else
            sleep 16200
          fi
          gh workflow run timer.yml -R "$REPO" --ref main && echo "timer dobara chalu"
