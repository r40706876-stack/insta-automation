name: Publish authorized hammer feather experiment once
on:
  push:
    branches: [main]
    paths: [.github/workflows/hammer_feather_publish.yml]
permissions:
  contents: write
concurrency:
  group: minuteme-hammer-feather-20261027
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install upload dependencies
        run: |
          pip install --timeout 30 --retries 1 -r requirements.txt imageio-ffmpeg
          python -c "import imageio_ffmpeg,os; p='/usr/local/bin/ffmpeg'; os.path.exists(p) or os.symlink(imageio_ffmpeg.get_ffmpeg_exe(),p)"
          python -m py_compile publish_hammer_feather.py
      - name: Set receipt commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Publish the exact reviewed science experiment once
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          REVIEWED_SHA256: '45529384a2746736a67079ccccd8982f5cd141a1e9e3a6bd2636d94c4ca89ef7'
          PYTHONUNBUFFERED: '1'
        run: python -u publish_hammer_feather.py
      - name: Preserve attempt and publication receipts
        if: always()
        run: |
          git add experiments/hammer_feather_20261027 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve science experiment receipts [skip ci]'
          git pull --rebase -X theirs
          git push
