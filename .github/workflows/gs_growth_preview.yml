name: GS growth end-to-end preview - no publication
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/gs_growth_preview.yml']
permissions:
  contents: read
concurrency:
  group: gs-growth-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ./.github/actions/gs-3d-dependencies
      - run: pip install --timeout 30 --retries 1 -r requirements.txt
      - name: Render and review a complete experiment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BLENDER_BIN: /tmp/blender/blender
          GS_VISUAL_SUBJECT: Geography
          GS_VISUAL_OUTPUT: experiments/growth_preview
          GS_FORCE_BUILD: '1'
          POST_MODE: manual
          PYTHONUNBUFFERED: '1'
        run: python daily_visual_gs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GS-growth-complete-preview
          path: |
            experiments/growth_preview
            studio_diagnostics
          if-no-files-found: warn
