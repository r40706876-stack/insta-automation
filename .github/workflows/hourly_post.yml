name: Regular GS reels - seven daily slots

on:
  # v2 (2026-10-23): GitHub ka schedule 45-90 min der se chalta tha -> ab "timer.yml" theek samay par isse
  # chalata hai (format ke saath). Yahan schedule band (warna dohri post).
  workflow_dispatch:
    inputs:
      format:
        description: "auto / mega / list / kahani / kahani_pages / kahani_short / current / trap / farak / trick / quiz"
        default: "auto"
      subject:
        description: "Optional exact bank subject"
        default: ""
      regular_slot:
        description: "Required timer slot for regular publication"
        default: ""
      target_utc:
        description: "Exact intended publication instant in UTC"
        default: ""
      post_mode:
        description: "publish = Instagram par daalo, manual = sirf repo ke ready_reels/ me (jaanch ke liye)"
        default: "publish"

permissions:
  contents: write

concurrency:
  group: science-pyq-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fast video dependencies
        run: |
          pip install --timeout 30 --retries 1 -r requirements.txt imageio-ffmpeg
          python -c "import imageio_ffmpeg,os; p='/usr/local/bin/ffmpeg'; os.path.exists(p) or os.symlink(imageio_ffmpeg.get_ffmpeg_exe(),p)"

      - name: Prepare shared 3D engine for subject explainers
        if: inputs.subject != '' || inputs.format == 'current'
        uses: ./.github/actions/gs-3d-dependencies

      - name: Reel banao + Instagram pe daalo
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
          BLENDER_BIN: /tmp/blender/blender
          GS_TARGET_UTC: ${{ github.event.inputs.target_utc }}
          GS_SUBJECT: ${{ github.event.inputs.subject }}
          GS_REGULAR_SCHEDULE: '20261026-v2'
          REGULAR_SLOT: ${{ github.event.inputs.regular_slot }}
          CRON_SLOT: ${{ github.event.schedule }}
          REEL_FORMAT: ${{ github.event.inputs.format || 'auto' }}   # auto = samay se: subah list, dopahar kahani, raat MEGA
          POST_MODE: ${{ github.event.inputs.post_mode || 'publish' }}   # 'manual' likho to Instagram pe post nahi, repo ke ready_reels/ me reel milegi
        run: |
          set -o pipefail
          if [ "$POST_MODE" = publish ] && { [ "$REEL_FORMAT" = current ] || [ "$GS_SUBJECT" = "Current Affairs" ]; }; then
            if python -c "import json,pathlib,sys; p=pathlib.Path('experiments/current_affairs_hold.json'); sys.exit(0 if p.exists() and json.loads(p.read_text()).get('held') else 1)"; then
              echo "CURRENT AFFAIRS HELD: user requested no publication"
              exit 0
            fi
          fi
          if [ "$POST_MODE" = publish ] && { [ -z "$REGULAR_SLOT" ] || [ -z "$GS_TARGET_UTC" ]; }; then
            echo "Old timer request blocked: use the new regular schedule slot"
            exit 0
          fi
          if [ -n "$GS_SUBJECT" ] || [ "$REEL_FORMAT" = current ]; then
            ENTRY=scheduled_visual_gs.py
          else
            ENTRY=auto_poster.py
          fi
          if python -u "$ENTRY" 2>&1 | sed -u -E 's/(access_token=|key=|Bearer )[^&" ]+/\1***/g' | tee last_run_log.txt; then exit 0; fi
          # Fallback: a failed subject explainer must not leave the slot empty -> post that subject's 7-PYQ list reel.
          if [ "$ENTRY" = scheduled_visual_gs.py ] && [ "$POST_MODE" = publish ] && [ "$GS_SUBJECT" != "Current Affairs" ] && [ "$REEL_FORMAT" != current ] && [ -n "$GS_TARGET_UTC" ]; then
            KEY=$(python -c "import datetime,os;t=datetime.datetime.fromisoformat(os.environ['GS_TARGET_UTC'].replace('Z','+00:00'));print(t.astimezone(datetime.timezone(datetime.timedelta(hours=5,minutes=30))).strftime('%Y-%m-%d_%H%M'))")
            if [ -e "experiments/scheduled_visual_gs/$KEY/publish_started.json" ] || [ -e "experiments/scheduled_visual_gs/$KEY/published.json" ]; then
              echo "::error::Explainer publish may have started; not posting a fallback (check Instagram)"; exit 1
            fi
            echo "::warning title=fallback::3D explainer failed for $GS_SUBJECT; posting the 7-PYQ list reel instead"
            REEL_FORMAT=list python -u auto_poster.py 2>&1 | sed -u -E 's/(access_token=|key=|Bearer )[^&" ]+/\1***/g' | tee -a last_run_log.txt
          else
            exit 1
          fi

      - name: Progress save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add experiments/gs_animation_studio studio_diagnostics 2>/dev/null || true
          git add experiments/scheduled_visual_gs 2>/dev/null || true
          git add experiments/regular_schedule 2>/dev/null || true
          git add progress.json
          git add last_run_log.txt 2>/dev/null || true
          git add carousels 2>/dev/null || true
          git add ready_reels 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update progress [skip ci]"
          git pull --rebase -X theirs --autostash || (git rebase --abort; git pull --no-rebase -X ours --no-edit) || true
          git push || true
