name: 3-Hourly Instagram Reel Auto-Post

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions: write-all

jobs:
  build-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & Hindi Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip
          pip install requests pypdf pillow edge-tts PyMuPDF

      - name: Run Automation Script
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python auto_poster.py

      - name: Commit and Push Progress
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update progress [skip ci]" && git push)
