name: Science PYQ Reel (din me 5 baar)

on:
  schedule:
    # GitHub UTC time maanta hai (India = UTC + 5:30). GitHub aksar 10-30 min der se chalata hai.
    # Exam students Insta sabse zyada: subah padhai se pehle, dopahar break, raat 8-10 (sabse bada peak).
    - cron: "15 1 * * *"     # subah ~7:00   -> 7 PYQ list
    - cron: "15 5 * * *"     # ~11:00        -> KAHANI purani (chitra page + awaaz) + carousel
    - cron: "15 8 * * *"     # dopahar ~2:00 -> TRICK card (bina awaaz)
    - cron: "45 11 * * *"    # shaam ~5:30   -> KAHANI (chitra page + kahani awaaz) + carousel
    - cron: "45 14 * * *"    # raat ~8:30    -> MEGA revision (sabse bada peak)
  workflow_dispatch:
    inputs:
      format:
        description: "auto / mega / list / kahani / kahani_pages / kahani_short / trick / quiz"
        default: "auto"
      post_mode:
        description: "publish = Instagram par daalo, manual = sirf repo ke ready_reels/ me (jaanch ke liye)"
        default: "publish"

permissions:
  contents: write

concurrency:
  group: science-pyq-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages (video + Hindi text shaping)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Reel banao + Instagram pe daalo
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
          CRON_SLOT: ${{ github.event.schedule }}
          REEL_FORMAT: ${{ github.event.inputs.format || 'auto' }}   # auto = samay se: subah list, dopahar kahani, raat MEGA
          POST_MODE: ${{ github.event.inputs.post_mode || 'publish' }}   # 'manual' likho to Instagram pe post nahi, repo ke ready_reels/ me reel milegi
        run: |
          set -o pipefail
          python -u auto_poster.py 2>&1 | sed -u -E 's/(access_token=|key=|Bearer )[^&" ]+/\1***/g' | tee last_run_log.txt

      - name: Progress save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json
          git add last_run_log.txt 2>/dev/null || true
          git add carousels 2>/dev/null || true
          git add ready_reels 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update progress [skip ci]"
          git pull --rebase -X theirs --autostash || (git rebase --abort; git pull --no-rebase -X ours --no-edit) || true
          git push || true
