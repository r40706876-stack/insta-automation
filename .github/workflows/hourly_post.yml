name: Science PYQ Reel (din me 6 baar)

on:
  schedule:
    # GitHub UTC time maanta hai (India = UTC + 5:30). India ka samay:
    - cron: "30 1 * * *"     # subah 7:00
    - cron: "30 4 * * *"     # subah 10:00
    - cron: "30 7 * * *"     # dopahar 1:00
    - cron: "30 10 * * *"    # shaam 4:00
    - cron: "0 13 * * *"     # shaam 6:30
    - cron: "30 15 * * *"    # raat 9:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: science-pyq-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages (video + Hindi text shaping)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Reel banao + Instagram pe daalo
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POST_MODE: publish        # 'manual' likho to Instagram pe post nahi, repo ke ready_reels/ me reel milegi
        run: python auto_poster.py

      - name: Progress save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json
          git add carousels 2>/dev/null || true
          git add ready_reels 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update progress [skip ci]"
          git pull --rebase --autostash || true
          git push || true
