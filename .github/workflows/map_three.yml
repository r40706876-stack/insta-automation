name: One Map Three Answers - isolated format experiment

on:
  push:
    branches: [main]
    paths: [experiments/map_three_request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: map-three-experiment
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer and narration dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0
          pip install -r requirements.txt
          curl --fail --location --retry 3 https://raw.githubusercontent.com/google/fonts/main/ofl/mukta/Mukta-ExtraBold.ttf -o Mukta-ExtraBold.ttf
      - name: Build or publish reviewed experiment
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          MODE=$(python -c "import json; r=json.load(open('experiments/map_three_request.json')); assert r['mode'] in ('build','publish'); print(r['mode'])")
          python map_three.py "$MODE"
      - name: Preserve video and publication receipt
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add experiments/map_three_01
          if ! git diff --cached --quiet; then
            git commit -m 'Save One Map Three Answers experiment result [skip ci]'
            git pull --rebase
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-three-01
          path: experiments/map_three_01
